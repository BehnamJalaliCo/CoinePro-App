# What this app calls itself. One file, read by Gradle and by CI alike.
#
# Semantic versioning (semver.org), and the Android `versionCode` is *derived* from it rather than
# tracked separately — see docs/VERSIONING.md and scripts/release/version.py. Two numbers that mean
# the same thing but are edited in two places will disagree eventually; this way they cannot.
#
#   versionCode = MAJOR*10_000_000 + MINOR*100_000 + PATCH*1_000 + BUILD
#
# BUILD is the number of commits since this file last changed, so every push produces a code
# strictly above the one before it without anyone having to remember to bump anything. Bumping any
# field here jumps further than BUILD can ever reach, so the order never inverts.
#
# Bump with:  python3 scripts/release/version.py --bump patch|minor|major
# Never edit MAJOR/MINOR/PATCH downwards. Android refuses to install a lower code over a higher one.

MAJOR=1
MINOR=13
PATCH=0

# Optional semver pre-release tag, for example rc.1 or beta.2. Empty means a final release.
# It changes the version *name* only; it has no effect on the code, because Android has nowhere to
# put it and a pre-release must still install over the build before it.
PRE_RELEASE=
