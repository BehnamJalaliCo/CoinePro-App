# Which Android Robolectric pretends to be when a test does not say.
#
# The app compiles and targets API 36. Robolectric's default is that same number, and the runner
# on GitHub's hosted machines answers it with
#
#     java.lang.UnsupportedOperationException at DefaultSdkProvider.java:170
#
# — one `classMethod FAILED` per test class that has even a single test without an explicit
# `@Config(sdk = ...)`. It cost four classes and every APK build on `main`: the tests pass in a
# container that already holds the jar for 36 and fail on a runner that has to fetch one, which is
# the worst shape a failure can have, because it is green exactly where somebody is looking.
#
# Thirty-four because it is what every deliberate `@Config` in this repository already names, so
# this changes nothing about the tests that were already explicit — it only stops the ones that are
# silent from asking for an Android that is not there. A test that genuinely needs another level
# still says so and still wins; this is the floor, not a ceiling.
sdk=34
