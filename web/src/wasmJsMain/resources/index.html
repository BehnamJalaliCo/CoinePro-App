<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- Every relative path below resolves against /terminal/, so a deep link such as
       /terminal/BTCUSDT/4h loads the same bundle a bare /terminal/ does (SERVER.md §3.1). -->
  <base href="/terminal/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pro Chart — live crypto and forex charts in the browser.">
  <title>Pro Chart</title>
  <!-- Installable as an app, with the phone's launcher icon (scripts/design/build-web-icons.py). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B0E11">
  <script>
    // The browser's own bar follows the theme the reader chose in the app (kept by the web
    // DataStore shim under datastore:coinepro_preferences → theme_mode), else the system's.
    (function () {
      var mode = 'system';
      try {
        var prefs = JSON.parse(localStorage.getItem('datastore:coinepro_preferences') || '{}');
        if (prefs.theme_mode && prefs.theme_mode.v) mode = prefs.theme_mode.v;
      } catch (e) {}
      if (mode === 'system') {
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      var bar = { light: '#F7F8FA', midnight: '#000000' }[mode] || '#0B0E11';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    /* White in every theme, like the app's own launch sheet (LaunchSplash.kt: «white and black,
       in both themes»), which Compose draws next. A dark page here was the first of three swaps a
       reader saw on every load — dark, then that white sheet, then the app (MOBILE-32). The mark
       is drawn in by the launch sheet itself, so this frame carries nothing but the sheet. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
    #terminal { position: fixed; inset: 0; }
    #splash { position: fixed; inset: 0; background: #FFFFFF; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="splash" aria-hidden="true"></div>
  <noscript>Pro Chart needs JavaScript and WebAssembly.</noscript>
  <!-- The one package the compiled code imports by name; see terminalBundle in web/build.gradle.kts. -->
  <script type="importmap">{ "imports": { "@js-joda/core": "./js-joda.esm.js" } }</script>
  <script type="module" src="terminal.mjs"></script>
  <script>
    // sw.js: network first, the last good copy when offline. A new worker takes over and the page
    // reloads once, so a release is never half old and half new.
    if ('serviceWorker' in navigator) {
      var reloading = false, hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !reloading) { reloading = true; window.location.reload(); }
        hadController = true;
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (r) { r.update().catch(function () {}); }).catch(function () {});
      });
    }
  </script>
</body>
</html>
