name: Android CI

on:
  pull_request:
    branches: [main, bootstrap/android-foundation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    # Seventy-five, and the thirty-five it replaces was never a measurement.
    #
    # This job runs three lint variants, the unit tests, five assembles and then a `bundleRelease`
    # — which is a *second* R8 pass over the whole app. It has not finished inside thirty-five
    # minutes for a long time; it only appeared to fit because `lintDebug` was failing at about
    # thirteen and taking the job down with it. With lint passing, the job got as far as
    # `minifyReleaseWithR8` and was killed by the clock at exactly 35:00, which reads in the run
    # list as «cancelled» and tells nobody anything.
    #
    # Raising the wall rather than cutting the work: every task in that step is checking something
    # the release depends on, and a green build that stopped checking half of them is worse than a
    # slow one. The other job in this workflow finishes in twenty-five and keeps its own budget.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Verify toolchain
        run: gradle --version

      - name: Enforce reduced-motion policy
        run: bash scripts/quality/check-motion-policy.sh

      - name: Enforce Kotlin style
        run: bash scripts/quality/check-kotlin-style.sh

      # `docs/legal/` is the only place the two documents are written; the app reads committed
      # copies of them. Without this check a revision nobody re-synced ships an out-of-date
      # document to readers while the published site shows the new one.
      - name: The in-app legal documents match their sources
        run: python3 scripts/release/sync-legal-documents.py --check

      - name: Validate release scripts and version contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/release/validate-version.sh scripts/release/publish-play-internal.sh
          python3 -m py_compile scripts/release/production-readonly-smoke.py scripts/quality/check-cross-phase-consistency.py
          bash scripts/release/validate-version.sh "0.2.0-rc.1" "200001"
          if bash scripts/release/validate-version.sh "invalid-version" "0"; then
            echo "::error::Invalid release version unexpectedly passed validation."
            exit 1
          fi

      # The visual-parity specs are the argument, not the plumbing: a mask class nobody named, a
      # measurement with a budget looser than the gate, a declared difference with no label. Each
      # is a hole in the reasoning that would otherwise surface on the day somebody finally has a
      # TradingView reference pack in their hands, which is the worst day to find it. Needs no
      # reference pack, no capture and no imaging library.
      - name: The visual-parity specs are well-formed
        run: python3 scripts/visual/compare_tradingview_reference.py --validate

      - name: Enforce Phase 1-17 repository consistency
        run: python3 scripts/quality/check-cross-phase-consistency.py

      - name: Lint, test, and assemble debug + staging + release + benchmark
        run: gradle --no-daemon :core:auth:testDebugUnitTest :core:network:testDebugUnitTest :core:marketdata:testDebugUnitTest :core:signals:testDebugUnitTest :core:notifications:testDebugUnitTest :core:execution:testDebugUnitTest :core:aisignal:testDebugUnitTest :core:aivision:testDebugUnitTest :core:aiassistant:testDebugUnitTest :core:marketintel:testDebugUnitTest :core:database:testDebugUnitTest :feature:tools:testDebugUnitTest :app:lintDebug :app:lintStaging :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleStaging :app:assembleRelease :app:assembleBenchmark :benchmark:assembleBenchmark

      - name: Verify protected release signing path
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/coinepro-phase16-signing"
          mkdir -p "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          keystore="$signing_dir/ci-release.jks"
          verify_log="$signing_dir/jarsigner-verify.log"
          password="$(openssl rand -hex 16)"

          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "$password" \
            -keypass "$password" \
            -alias phase16-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CoinePro Phase16 CI, OU=CI, O=CoinePro, L=CI, ST=CI, C=DE"

          export ORG_GRADLE_PROJECT_COINEPRO_RELEASE_STORE_FILE="$keystore"
          export ORG_GRADLE_PROJECT_COINEPRO_RELEASE_STORE_PASSWORD="$password"
          export ORG_GRADLE_PROJECT_COINEPRO_RELEASE_KEY_ALIAS="phase16-ci"
          export ORG_GRADLE_PROJECT_COINEPRO_RELEASE_KEY_PASSWORD="$password"
          export ORG_GRADLE_PROJECT_COINEPRO_PRODUCTION_API_BASE_URL="https://release-ci.example.invalid/"
          # Derived from version.properties like every other build, with a `-ci` tag so nothing
          # produced here can be mistaken for a release. It used to be a hardcoded "16.0.1-ci",
          # which read as a version 16 that has never existed — the 16 was a phase number.
          export ORG_GRADLE_PROJECT_COINEPRO_VERSION_CODE="$(python3 scripts/release/version.py --code)"
          export ORG_GRADLE_PROJECT_COINEPRO_VERSION_NAME="$(python3 scripts/release/version.py --name)-ci"

          gradle --no-daemon :app:bundleRelease
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -f "$aab"

          jarsigner -verify -verbose -certs "$aab" | tee "$verify_log"
          grep -Fq "jar verified." "$verify_log"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # **Two jobs, two emulators, and the build done before either one starts.**
  #
  # This was one job that launched an emulator, ran the instrumented suite, and then — with qemu
  # still resident — compiled the whole benchmark variant: `lintVitalAnalyzeRelease` across every
  # module and an R8 pass, on a runner that was already holding a four-gigabyte virtual machine.
  # It died at `##[error]The runner has received a shutdown signal` with the emulator, netsimd and
  # qemu all terminated as orphans, which is what a runner running out of memory looks like from
  # the outside. It is not a flake and re-running it does not fix it.
  #
  # So: each suite gets its own runner and its own emulator lifecycle, and on each of them the
  # compiling is finished *before* the emulator is launched. A failure in one no longer takes the
  # other with it, and neither is holding a VM while R8 runs.
  #
  # Neither carries `continue-on-error`. A release candidate is a SHA on which every job passed,
  # and a job that is allowed to fail is not evidence of anything.
  compose-ui-tests:
    name: Compose UI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
          cache-read-only: true

      # Before the emulator, not during it. Compiling the app and its test APK is the expensive
      # half of this job and there is no reason for a virtual machine to be resident while it runs.
      - name: Assemble the app and its instrumented suite
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests and capture the real rendered app menu
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/screenshots
            # **Pulled from /sdcard, not through `run-as`.**
            #
            # Gradle uninstalls the app when `connectedDebugAndroidTest` finishes, so by the time
            # this line runs `run-as com.coinepro.app` has no package to enter. It printed
            # `run-as: unknown package: com.coinepro.app` — forty-two bytes — straight into the
            # artifact, and `test -s` passed it because an error message is not empty. The job was
            # green and the uploaded "real rendered app menu" was a sentence about failure.
            #
            # /sdcard belongs to the device rather than to the package, so the capture is still
            # there after the uninstall. The test writes it and checks its size before it passes.
            adb pull /sdcard/coinepro-menu-render.png app/build/screenshots/coinepro-menu-render.png
            # And the file is checked for being a PNG rather than for being non-empty, which is the
            # distinction the old check could not make.
            head -c 8 app/build/screenshots/coinepro-menu-render.png | od -An -tx1 | tr -d ' \n' \
              | grep -qx '89504e470d0a1a0a' \
              || { echo "::error::the pulled capture is not a PNG"; head -c 200 app/build/screenshots/coinepro-menu-render.png; exit 1; }

      - name: Upload actual rendered app menu screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-actual-menu-screenshot
          path: app/build/screenshots/coinepro-menu-render.png
          if-no-files-found: error
          retention-days: 7

  benchmark-smoke:
    name: Performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
          cache-read-only: true

      # The benchmark variant is minified, so assembling it is an R8 pass over the whole app. That
      # is precisely the work that was killing the runner when it ran with an emulator up.
      #
      # `lintVitalAnalyzeRelease` is excluded and only that: it is wired into every release-like
      # variant, so it was being run a second time here across every module while a VM was
      # resident, and the `Lint, test, build` job above already runs lint on this SHA. Nothing else
      # is skipped.
      - name: Assemble the benchmark variant
        run: gradle --no-daemon :app:assembleBenchmark :benchmark:assembleBenchmark -x lintVitalAnalyzeRelease -x lintVitalReportRelease

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Benchmark wiring smoke
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :benchmark:connectedBenchmarkAndroidTest -x lintVitalAnalyzeRelease -x lintVitalReportRelease -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
