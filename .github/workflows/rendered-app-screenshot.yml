name: Actual App Menu Screenshot

on:
  push:
    branches: [feat/phase17-launch-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
          cache-read-only: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render actual app menu on Pixel 6 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.coinepro.app.ActualAppMenuScreenshotTest
            mkdir -p app/build/screenshots
            adb exec-out run-as com.coinepro.app cat files/coinepro-menu-render.png > app/build/screenshots/coinepro-menu-render.png
            test -s app/build/screenshots/coinepro-menu-render.png

      - name: Upload actual rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-actual-menu-screenshot
          path: app/build/screenshots/coinepro-menu-render.png
          if-no-files-found: error
          retention-days: 7
