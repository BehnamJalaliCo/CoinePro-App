name: Connected Test APK

on:
  pull_request:
    branches: [main, bootstrap/android-foundation]

permissions:
  contents: read

concurrency:
  group: connected-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-connected-test-apk:
    name: Build connected test APK
    if: github.head_ref == 'feat/phase17-launch-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Build debug APK against the user API
        run: gradle --no-daemon :app:assembleDebug -PCOINEPRO_DEBUG_API_BASE_URL=https://user.pro-chart.com/api/

      - name: Upload connected test APK
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-connected-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
