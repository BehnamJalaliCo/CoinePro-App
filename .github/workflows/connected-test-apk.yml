name: CoinePro Staging Test APK

on:
  pull_request:
    branches: [main, bootstrap/android-foundation]

permissions:
  contents: read

concurrency:
  group: coinepro-staging-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-test-apk:
    name: Build CoinePro staging test APK
    if: github.head_ref == 'feat/phase17-launch-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: play-internal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Validate CoinePro staging configuration
        shell: bash
        env:
          STAGING_API_BASE_URL: ${{ secrets.COINEPRO_STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_API_BASE_URL" ]]; then
            echo "::error::COINEPRO_STAGING_API_BASE_URL is missing from play-internal."
            exit 1
          fi
          if [[ "$STAGING_API_BASE_URL" != https://* ]]; then
            echo "::error::COINEPRO_STAGING_API_BASE_URL must be HTTPS."
            exit 1
          fi

      - name: Build CoinePro staging test APK
        env:
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_API_BASE_URL: ${{ secrets.COINEPRO_STAGING_API_BASE_URL }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_PROJECT_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_APPLICATION_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_API_KEY: ${{ secrets.COINEPRO_STAGING_FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_SENDER_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleStaging
          test -f app/build/outputs/apk/staging/app-staging.apk

      - name: Upload CoinePro staging test APK
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-staging-test-apk
          path: app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
          retention-days: 7
