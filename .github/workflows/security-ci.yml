name: Security CI

on:
  pull_request:
    branches: [main, bootstrap/android-foundation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-secret-scan:
    name: Tracked secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan tracked files for credential material
        run: bash scripts/security/scan-secrets.sh

  resolved-dependency-audit:
    name: Resolved dependency OSV audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Export resolved Android runtime dependencies
        run: gradle --no-daemon -I scripts/security/export-dependencies.init.gradle :app:exportSecurityDependencies

      - name: Audit resolved dependencies against OSV
        run: python3 scripts/security/osv-audit.py
