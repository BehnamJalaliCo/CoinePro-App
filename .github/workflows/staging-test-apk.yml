name: Staging Test APK

on:
  pull_request:
    branches:
      - bootstrap/android-foundation
  push:
    branches:
      - feat/phase17-launch-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinepro-staging-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    name: Build connected staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: play-internal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Validate staging service configuration
        shell: bash
        env:
          STAGING_API_BASE_URL: ${{ secrets.COINEPRO_STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_API_BASE_URL" || "$STAGING_API_BASE_URL" != https://* ]]; then
            echo "::error::COINEPRO_STAGING_API_BASE_URL is missing or is not HTTPS."
            exit 1
          fi

      - name: Build connected staging APK
        env:
          ORG_GRADLE_PROJECT_COINEPRO_VERSION_NAME: "0.2.0-test"
          ORG_GRADLE_PROJECT_COINEPRO_VERSION_CODE: "170001"
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_API_BASE_URL: ${{ secrets.COINEPRO_STAGING_API_BASE_URL }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_PROJECT_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_APPLICATION_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_API_KEY: ${{ secrets.COINEPRO_STAGING_FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_COINEPRO_STAGING_FIREBASE_SENDER_ID: ${{ secrets.COINEPRO_STAGING_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleStaging
          apk="app/build/outputs/apk/staging/app-staging.apk"
          test -f "$apk"

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: coinepro-staging-test-apk
          path: app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
          retention-days: 7
