import org.gradle.api.artifacts.component.ModuleComponentIdentifier

allprojects { project ->
    if (project.path == ':app') {
        project.tasks.register('exportSecurityDependencies') {
            group = 'verification'
            description = 'Exports resolved app runtime Maven dependencies for security scanning.'

            doLast {
                def output = project.rootProject.file('build/security/resolved-dependencies.tsv')
                output.parentFile.mkdirs()
                def coordinates = new TreeSet<String>()

                ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { configurationName ->
                    def configuration = project.configurations.findByName(configurationName)
                    if (configuration == null || !configuration.canBeResolved) {
                        throw new GradleException("Required security configuration is not resolvable: ${configurationName}")
                    }
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        def identifier = component.id
                        if (identifier instanceof ModuleComponentIdentifier) {
                            coordinates.add("${identifier.group}\t${identifier.module}\t${identifier.version}")
                        }
                    }
                }

                if (coordinates.isEmpty()) {
                    throw new GradleException('Security dependency export produced no resolved Maven coordinates.')
                }

                output.text = coordinates.join(System.lineSeparator()) + System.lineSeparator()
                println("Exported ${coordinates.size()} resolved dependencies to ${output}")
            }
        }
    }
}
